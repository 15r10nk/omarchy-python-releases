repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-format
  - repo: local
    hooks:
      - id: qmlformat
        name: Format QML
        language: python
        entry: pyside6-qmlformat
        additional_dependencies: [PySide6-Essentials==6.12.0]
        files: '\.qml$'
        args: [--inplace, --indent-width, '2', --newline, unix]
